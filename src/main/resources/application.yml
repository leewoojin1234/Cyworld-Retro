server:
  port: 8080

spring:
  application:
    name: cyworld-retro

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cyworld;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    defer-datasource-initialization: true

jwt:
  secret: VmVyeVNlY3JldEtleUZvckN5d29ybGRSZXRyb1Byb2plY3QyMDI2U3ByaW5nQm9vdFRlc3Q=
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 12096000
